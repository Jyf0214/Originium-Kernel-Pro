# Deploy blog to GitHub Pages (static export)
#
# 通过 NEXT_STATIC_EXPORT=true 环境变量启用静态导出模式，
# 控制 output: 'export'、trailingSlash、images.unoptimized 等配置。
# filter-db-routes.mjs 在构建前移除所有数据库依赖路由目录，
# configure-pages@v5 自动注入 output: 'export' 和 images.unoptimized。
#
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Generate static data
        # 与本地 prebuild（download-avatar/generate-favicon/generate-navigation/generate-pwa/generate-site-config-ts）
        # 及 build（generate-search-index/generate-tags/generate-version）保持一致，
        # 否则 CI 产物缺失 avatar/favicon/搜索索引/标签数据
        run: node scripts/download-avatar.mjs && node scripts/generate-favicon.mjs && node scripts/generate-navigation.mjs && node scripts/generate-pwa.mjs && node scripts/generate-site-config-ts.mjs && node scripts/generate-version.mjs && node scripts/generate-search-index.mjs && node scripts/generate-tags.mjs
      - name: Remove configure-pages generated next.config.js
        # configure-pages 会创建 CommonJS 格式的 next.config.js（module.exports），
        # 与 package.json 的 "type": "module" 冲突导致加载失败；
        # 项目改用 next.config.ts，basePath 通过 NEXT_PUBLIC_BASE_PATH 环境变量传入
        run: rm -f next.config.js
      - name: Generate Prisma Client
        # prisma/generated 被 .gitignore 排除，CI checkout 后不存在，需显式生成，
        # 否则 next build 报 Module not found: Can't resolve '../../prisma/generated/prisma/client'
        run: npm run db:generate
      - name: Build with Next.js (static export via webpack)
        run: ${{ steps.detect-package-manager.outputs.runner }} node scripts/build-wrapper.mjs
        env:
          NEXT_STATIC_EXPORT: 'true'
          # 前端构建期标记：静态导出下 /api 路由被移除，相关组件（点赞等）禁用
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # 静态导出构建期解析站点 URL（canonical/JSON-LD/feed），缺省会生成 example.com 占位
          APP_URL: https://${{ github.repository_owner }}.github.io${{ steps.pages.outputs.base_path }}
      - name: Stamp SW cache version
        run: |
          HASH=$(echo "${{ github.sha }}" | cut -c1-7)
          sed -i "s/originium-v1/originium-${HASH}/g" out/sw.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
