# 作者列表
# name: 唯一标识，与帖子 frontmatter 中的 author 字段匹配
# nickname: 显示昵称（可选，默认使用 name）
# avatar: 头像路径，如 /avatar.jpg 或 https://...（可选）
# location: 所在地（可选）
# bio: 简短留言/签名（可选）
# enable: 是否启用作者状态卡片（可选，默认 false）
# statusImg: 状态图片 URL（可选）
# skills: 技能标签列表（可选）

# 示例：
# - name: "作者名"
#   nickname: "显示昵称"
#   avatar: "/avatar.jpg"
#   enable: true
